name: nanys_care
description: Sistema de Gestión Nanys Care - Aplicación para conectar tutores con cuidadores de niños
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  crypto: ^3.0.7
  provider: ^6.1.1
  table_calendar: ^3.0.9
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.0.7
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
